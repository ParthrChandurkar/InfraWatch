# Disposable Redis cache for short-lived Prometheus query responses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrawatch-redis
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: infrawatch-redis
    app.kubernetes.io/part-of: infrawatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infrawatch-redis
      app.kubernetes.io/part-of: infrawatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrawatch-redis
        app.kubernetes.io/part-of: infrawatch
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
