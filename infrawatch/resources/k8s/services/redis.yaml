# Cluster-internal Service for the disposable Redis metrics cache.
apiVersion: v1
kind: Service
metadata:
  name: infrawatch-redis
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: infrawatch-redis
    app.kubernetes.io/part-of: infrawatch
spec:
  selector:
    app.kubernetes.io/name: infrawatch-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
