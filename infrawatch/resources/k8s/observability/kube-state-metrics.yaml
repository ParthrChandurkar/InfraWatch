apiVersion: v1
kind: ServiceAccount
metadata:
  name: infrawatch-kube-state-metrics
  namespace: infrawatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infrawatch-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infrawatch-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infrawatch-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: infrawatch-kube-state-metrics
    namespace: infrawatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrawatch-kube-state-metrics
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: infrawatch-kube-state-metrics
    app.kubernetes.io/part-of: infrawatch-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infrawatch-kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrawatch-kube-state-metrics
        app.kubernetes.io/part-of: infrawatch-observability
    spec:
      serviceAccountName: infrawatch-kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0
          imagePullPolicy: IfNotPresent
          args:
            - --resources=pods,nodes,namespaces,services,persistentvolumeclaims,deployments,statefulsets,daemonsets,replicasets,horizontalpodautoscalers,jobs,cronjobs
          ports:
            - name: http
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: telemetry
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: telemetry
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: infrawatch-kube-state-metrics
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: infrawatch-kube-state-metrics
spec:
  selector:
    app.kubernetes.io/name: infrawatch-kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: telemetry
      port: 8081
      targetPort: telemetry
