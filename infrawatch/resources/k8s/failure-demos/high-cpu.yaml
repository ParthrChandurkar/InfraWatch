apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-cpu-demo
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: high-cpu-demo
    app.kubernetes.io/part-of: infrawatch-failure-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: high-cpu-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: high-cpu-demo
        app.kubernetes.io/part-of: infrawatch-failure-demo
    spec:
      containers:
        - name: high-cpu-demo
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - while true; do :; done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
