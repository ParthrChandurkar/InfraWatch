apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: crashloop-demo
    app.kubernetes.io/part-of: infrawatch-failure-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crashloop-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashloop-demo
        app.kubernetes.io/part-of: infrawatch-failure-demo
    spec:
      restartPolicy: Always
      containers:
        - name: crashloop-demo
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - echo "intentional crash for InfraWatch demo"; exit 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
