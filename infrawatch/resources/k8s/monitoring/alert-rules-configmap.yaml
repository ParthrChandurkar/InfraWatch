# Alert rules ConfigMap for clusters without the PrometheusRule CRD installed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: infrawatch-alert-rules
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: infrawatch-alert-rules
data:
  alert_rules.yml: |
    groups:
      - name: infrawatch.rules
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Service is down
              description: Prometheus could not scrape a target for more than 1 minute.
          - alert: HighCpuUsage
            expr: sum(rate(container_cpu_usage_seconds_total[5m])) by (pod) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Pod CPU usage above 80 percent
              description: A pod has been consuming high CPU for at least 5 minutes.
          - alert: PodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Pod is crash looping
              description: A pod has been in CrashLoopBackOff.
          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable{namespace="infrawatch"} > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Deployment has unavailable replicas
              description: A deployment in the InfraWatch namespace has unavailable replicas.
