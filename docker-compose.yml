# Local development stack for InfraWatch.
services:
  backend:
    build:
      context: ./backend
    container_name: infrawatch-backend
    environment:
      INFRAWATCH_ENVIRONMENT: development
      INFRAWATCH_EXECUTE_KUBECTL: "false"
      INFRAWATCH_PROMETHEUS_URL: http://prometheus:9090
      INFRAWATCH_LOKI_URL: http://loki:3100
      INFRAWATCH_ALERTMANAGER_URL: http://alertmanager:9093
      INFRAWATCH_ALLOW_MOCK_OBSERVABILITY: ${INFRAWATCH_ALLOW_MOCK_OBSERVABILITY:-true}
      INFRAWATCH_SERVICE_NAME: infrawatch-backend
      INFRAWATCH_STATE_FILE: /data/deployments.json
      INFRAWATCH_AUDIT_FILE: /data/audit-log.json
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-5}
      DATABASE_URL: postgresql://${POSTGRES_USER:-infrawatch}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-infrawatch}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-state:/data
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
      loki:
        condition: service_started
      redis:
        condition: service_started
    networks:
      infrawatch:
        aliases:
          - infrawatch-backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: infrawatch-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend
    networks:
      - infrawatch

  postgres:
    image: postgres:16-alpine
    container_name: infrawatch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrawatch} -d ${POSTGRES_DB:-infrawatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrawatch

  redis:
    image: redis:7.4-alpine
    container_name: infrawatch-redis
    networks:
      - infrawatch

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: infrawatch-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    networks:
      - infrawatch

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: infrawatch-alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - infrawatch

  grafana:
    image: grafana/grafana:11.4.0
    container_name: infrawatch-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - infrawatch

  loki:
    image: grafana/loki:3.3.2
    container_name: infrawatch-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - infrawatch

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: infrawatch-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - infrawatch

volumes:
  backend-state:
  postgres-data:
  grafana-data:
  alloy-data:

networks:
  infrawatch:
    driver: bridge
