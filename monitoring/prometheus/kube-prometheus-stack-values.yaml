# Helm values for kube-prometheus-stack in the InfraWatch namespace.
fullnameOverride: infrawatch-kube-prometheus

defaultRules:
  create: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  adminUser: admin
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://infrawatch-loki-gateway
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 2d
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 700m
        memory: 1Gi
    additionalScrapeConfigs:
      - job_name: infrawatch-backend
        metrics_path: /internal/metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - infrawatch
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: infrawatch-backend
            action: keep
          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            regex: http
            action: keep
      - job_name: infrawatch-annotated-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - infrawatch
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: "true"
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: workload

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kubeApiServer:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

additionalPrometheusRulesMap:
  infrawatch-rules:
    groups:
      - name: infrawatch.rules
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Service is down
              description: Prometheus could not scrape a target for more than 1 minute.
          - alert: HighCpuUsage
            expr: sum(rate(container_cpu_usage_seconds_total{namespace="infrawatch"}[5m])) by (pod) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Pod CPU usage above 80 percent
              description: A pod has been consuming high CPU for at least 5 minutes.
          - alert: PodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{namespace="infrawatch",reason="CrashLoopBackOff"}[5m]) >= 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Pod is crash looping
              description: A pod has been in CrashLoopBackOff.
          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable{namespace="infrawatch"} > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Deployment has unavailable replicas
              description: A deployment in the InfraWatch namespace has unavailable replicas for more than 2 minutes.
