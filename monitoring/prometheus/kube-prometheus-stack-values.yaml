# Helm values for kube-prometheus-stack in the InfraWatch namespace.
fullnameOverride: infrawatch-kube-prometheus

defaultRules:
  create: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  adminUser: admin
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://infrawatch-loki-gateway
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 2d
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 700m
        memory: 1Gi
    additionalScrapeConfigs:
      - job_name: infrawatch-backend
        metrics_path: /internal/metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - infrawatch
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: infrawatch-backend
            action: keep
          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            regex: http
            action: keep
      - job_name: infrawatch-annotated-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - infrawatch
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: "true"
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: workload

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kubeApiServer:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

additionalPrometheusRulesMap:
  infrawatch-rules:
    groups:
      - name: infrawatch.rules
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
              service: "{{ $labels.job }}"
              namespace: infrawatch
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "Prometheus could not scrape {{ $labels.instance }} for more than 1 minute."
          - alert: BackendUnavailable
            expr: up{job="infrawatch-backend"} == 0
            for: 30s
            labels:
              severity: critical
              service: infrawatch-backend
              namespace: infrawatch
            annotations:
              summary: InfraWatch backend scrape is unavailable
              description: Prometheus cannot scrape the InfraWatch backend metrics endpoint.
          - alert: HighCpuUsage
            expr: sum(rate(container_cpu_usage_seconds_total{namespace="infrawatch",pod!=""}[5m])) by (namespace, pod) > 0.8
            for: 5m
            labels:
              severity: warning
              service: "{{ $labels.pod }}"
              namespace: "{{ $labels.namespace }}"
            annotations:
              summary: "Pod {{ $labels.pod }} CPU is elevated"
              description: "Pod {{ $labels.pod }} has been consuming high CPU for at least 5 minutes."
          - alert: HighMemoryUsage
            expr: sum(container_memory_working_set_bytes{namespace="infrawatch",pod!=""}) by (namespace, pod) / 1024 / 1024 > 700
            for: 5m
            labels:
              severity: warning
              service: "{{ $labels.pod }}"
              namespace: "{{ $labels.namespace }}"
            annotations:
              summary: "Pod {{ $labels.pod }} memory is elevated"
              description: "Pod {{ $labels.pod }} is using more than 700 MB of working set memory."
          - alert: PodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{namespace="infrawatch",reason="CrashLoopBackOff"}[5m]) >= 1
            for: 2m
            labels:
              severity: critical
              service: "{{ $labels.pod }}"
              namespace: "{{ $labels.namespace }}"
              pod: "{{ $labels.pod }}"
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is in CrashLoopBackOff."
          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable{namespace="infrawatch"} > 0
            for: 30s
            labels:
              severity: warning
              service: "{{ $labels.deployment }}"
              namespace: "{{ $labels.namespace }}"
            annotations:
              summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
              description: "Deployment {{ $labels.deployment }} has {{ $value }} unavailable replica(s)."
