# Lightweight Prometheus configuration for the local Kubernetes stack.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - infrawatch-alertmanager:9093

scrape_configs:
  - job_name: infrawatch-backend
    metrics_path: /internal/metrics
    static_configs:
      - targets:
          - infrawatch-backend:8000

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - infrawatch-kube-state-metrics:8080

  - job_name: kubernetes-cadvisor
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels:
          - __meta_kubernetes_node_name
        target_label: __metrics_path__
        regex: (.+)
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - source_labels:
          - __meta_kubernetes_node_name
        target_label: node
