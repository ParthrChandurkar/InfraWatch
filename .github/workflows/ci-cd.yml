# CI/CD pipeline for validating, building, publishing, and deploying InfraWatch.
name: InfraWatch CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint backend
        working-directory: backend
        run: ruff check app tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Install CLI package
        run: pip install -e .

      - name: Lint CLI package
        run: ruff check infrawatch tests

      - name: Run CLI tests
        run: python -m pytest tests

      - name: Verify CLI entry point
        run: |
          infrawatch --help
          infrawatch --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend image locally
        run: docker build -t infrawatch-backend:test ./backend

      - name: Build frontend image locally
        run: docker build -t infrawatch-frontend:test ./frontend

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform foundation
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate

  publish:
    name: Publish immutable images
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require DockerHub credentials
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DockerHub publishing requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - name: Normalize DockerHub username
        run: |
          clean_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$clean_username" ]; then
            echo "::error::DOCKERHUB_USERNAME is empty after trimming whitespace."
            exit 1
          fi
          echo "DOCKERHUB_USERNAME_CLEAN=$clean_username" >> "$GITHUB_ENV"

      - name: Set Docker image names
        run: |
          echo "BACKEND_IMAGE=${DOCKERHUB_USERNAME_CLEAN}/infrawatch-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${DOCKERHUB_USERNAME_CLEAN}/infrawatch-frontend" >> "$GITHUB_ENV"

      - name: Log in to DockerHub
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME_CLEAN" --password-stdin

      - name: Build and push backend image
        run: |
          docker build \
            -t "$BACKEND_IMAGE:${GITHUB_SHA}" \
            -t "$BACKEND_IMAGE:latest" \
            ./backend
          docker push "$BACKEND_IMAGE:${GITHUB_SHA}"
          docker push "$BACKEND_IMAGE:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            -t "$FRONTEND_IMAGE:${GITHUB_SHA}" \
            -t "$FRONTEND_IMAGE:latest" \
            ./frontend
          docker push "$FRONTEND_IMAGE:${GITHUB_SHA}"
          docker push "$FRONTEND_IMAGE:latest"

  deploy:
    name: Deploy to configured Kubernetes cluster
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Kubernetes deployment credentials
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::notice::KUBE_CONFIG_B64 is not configured. Docker images were published, but Kubernetes deployment is skipped."
            echo "KUBE_DEPLOY_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "KUBE_DEPLOY_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Mark deployment skipped
        if: env.KUBE_DEPLOY_ENABLED == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "InfraWatch Kubernetes deployment",
              description: "Skipped: KUBE_CONFIG_B64 is not configured."
            });

      - name: Mark deployment pending
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "InfraWatch Kubernetes deployment",
              description: "Published images are being rolled out to Kubernetes."
            });

      - name: Set Docker image names
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: |
          clean_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$clean_username" ]; then
            echo "::error::DOCKERHUB_USERNAME is empty after trimming whitespace."
            exit 1
          fi
          echo "BACKEND_IMAGE=${clean_username}/infrawatch-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${clean_username}/infrawatch-frontend" >> "$GITHUB_ENV"

      - name: Configure kubectl
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Set up Terraform
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Apply Terraform foundation
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: |
          terraform -chdir=terraform init
          import_if_exists() {
            address="$1"
            import_id="$2"
            shift 2
            if kubectl "$@" >/dev/null 2>&1; then
              terraform -chdir=terraform import "$address" "$import_id" || true
            fi
          }
          import_if_exists kubernetes_namespace_v1.infrawatch infrawatch get namespace infrawatch
          import_if_exists kubernetes_service_account_v1.backend infrawatch/infrawatch-backend get serviceaccount infrawatch-backend --namespace infrawatch
          import_if_exists kubernetes_cluster_role_v1.local_reader infrawatch-local-reader get clusterrole infrawatch-local-reader
          import_if_exists kubernetes_cluster_role_binding_v1.local_reader infrawatch-local-reader get clusterrolebinding infrawatch-local-reader
          import_if_exists kubernetes_role_v1.deployer infrawatch/infrawatch-deployer get role infrawatch-deployer --namespace infrawatch
          import_if_exists kubernetes_role_binding_v1.deployer infrawatch/infrawatch-deployer get rolebinding infrawatch-deployer --namespace infrawatch
          import_if_exists kubernetes_resource_quota_v1.infrawatch infrawatch/infrawatch-quota get resourcequota infrawatch-quota --namespace infrawatch
          import_if_exists kubernetes_config_map_v1.backend_config infrawatch/infrawatch-backend-config get configmap infrawatch-backend-config --namespace infrawatch
          terraform -chdir=terraform apply -auto-approve

      - name: Apply Kubernetes manifests
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: kubectl apply -k k8s

      - name: Roll out new images
        if: env.KUBE_DEPLOY_ENABLED == 'true'
        run: |
          kubectl set image deployment/infrawatch-backend backend="$BACKEND_IMAGE:${GITHUB_SHA}" --namespace infrawatch
          kubectl set image deployment/infrawatch-frontend frontend="$FRONTEND_IMAGE:${GITHUB_SHA}" --namespace infrawatch
          kubectl rollout status deployment/infrawatch-backend --namespace infrawatch --timeout=180s
          kubectl rollout status deployment/infrawatch-frontend --namespace infrawatch --timeout=180s

      - name: Mark deployment result
        if: always() && env.KUBE_DEPLOY_ENABLED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "InfraWatch Kubernetes deployment",
              description: state === "success"
                ? "InfraWatch Kubernetes rollout completed."
                : "InfraWatch Kubernetes rollout failed."
            });

  deploy-local-minikube:
    name: Deploy to local Minikube through self-hosted runner
    needs: publish
    runs-on: [self-hosted, Windows, X64, local-k8s]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.INFRAWATCH_DEPLOY_TARGET == 'local-minikube' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Normalize DockerHub image names
        shell: powershell
        run: |
          $cleanUsername = ($env:DOCKERHUB_USERNAME -replace '\s', '').ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($cleanUsername)) {
            throw "DOCKERHUB_USERNAME is empty after trimming whitespace."
          }
          "DOCKERHUB_USERNAME_CLEAN=$cleanUsername" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BACKEND_IMAGE=$cleanUsername/infrawatch-backend" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FRONTEND_IMAGE=$cleanUsername/infrawatch-frontend" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify local Kubernetes access
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply Terraform local foundation
        shell: powershell
        run: |
          terraform -chdir=terraform init
          function Import-IfExists {
            param(
              [string]$Address,
              [string]$ImportId,
              [string[]]$KubectlArguments
            )
            kubectl @KubectlArguments > $null 2>&1
            if ($LASTEXITCODE -eq 0) {
              terraform -chdir=terraform import "-var=kube_context=minikube" $Address $ImportId
            }
          }
          Import-IfExists "kubernetes_namespace_v1.infrawatch" "infrawatch" @("get", "namespace", "infrawatch")
          Import-IfExists "kubernetes_service_account_v1.backend" "infrawatch/infrawatch-backend" @("get", "serviceaccount", "infrawatch-backend", "--namespace", "infrawatch")
          Import-IfExists "kubernetes_cluster_role_v1.local_reader" "infrawatch-local-reader" @("get", "clusterrole", "infrawatch-local-reader")
          Import-IfExists "kubernetes_cluster_role_binding_v1.local_reader" "infrawatch-local-reader" @("get", "clusterrolebinding", "infrawatch-local-reader")
          Import-IfExists "kubernetes_role_v1.deployer" "infrawatch/infrawatch-deployer" @("get", "role", "infrawatch-deployer", "--namespace", "infrawatch")
          Import-IfExists "kubernetes_role_binding_v1.deployer" "infrawatch/infrawatch-deployer" @("get", "rolebinding", "infrawatch-deployer", "--namespace", "infrawatch")
          Import-IfExists "kubernetes_resource_quota_v1.infrawatch" "infrawatch/infrawatch-quota" @("get", "resourcequota", "infrawatch-quota", "--namespace", "infrawatch")
          Import-IfExists "kubernetes_config_map_v1.backend_config" "infrawatch/infrawatch-backend-config" @("get", "configmap", "infrawatch-backend-config", "--namespace", "infrawatch")
          terraform -chdir=terraform apply -auto-approve "-var=kube_context=minikube"

      - name: Prepare database secret and DockerHub pull secret
        shell: powershell
        run: |
          $postgresPassword = "infrawatch-local-ci"
          $databaseUrl = "postgresql://infrawatch:$postgresPassword@infrawatch-postgres:5432/infrawatch"
          kubectl create secret generic infrawatch-secrets `
            --namespace infrawatch `
            --from-literal=POSTGRES_PASSWORD=$postgresPassword `
            --from-literal=DATABASE_URL=$databaseUrl `
            --dry-run=client `
            -o yaml | kubectl apply -f -

          kubectl create secret docker-registry dockerhub-pull-secret `
            --namespace infrawatch `
            --docker-server=https://index.docker.io/v1/ `
            --docker-username=$env:DOCKERHUB_USERNAME_CLEAN `
            --docker-password=$env:DOCKERHUB_TOKEN `
            --dry-run=client `
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        shell: powershell
        run: kubectl apply -k k8s

      - name: Configure DockerHub pull secret on workloads
        shell: powershell
        run: |
          kubectl patch serviceaccount default --namespace infrawatch --type merge --patch '{"imagePullSecrets":[{"name":"dockerhub-pull-secret"}]}'
          kubectl patch serviceaccount infrawatch-backend --namespace infrawatch --type merge --patch '{"imagePullSecrets":[{"name":"dockerhub-pull-secret"}]}'
          kubectl patch deployment infrawatch-backend --namespace infrawatch --type merge --patch '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"dockerhub-pull-secret"}]}}}}'
          kubectl patch deployment infrawatch-frontend --namespace infrawatch --type merge --patch '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"dockerhub-pull-secret"}]}}}}'

      - name: Roll out published DockerHub images
        shell: powershell
        run: |
          kubectl set image deployment/infrawatch-backend backend="$env:BACKEND_IMAGE:$env:GITHUB_SHA" --namespace infrawatch
          kubectl set image deployment/infrawatch-frontend frontend="$env:FRONTEND_IMAGE:$env:GITHUB_SHA" --namespace infrawatch
          kubectl rollout status statefulset/infrawatch-postgres --namespace infrawatch --timeout=180s
          kubectl rollout status deployment/infrawatch-backend --namespace infrawatch --timeout=180s
          kubectl rollout status deployment/infrawatch-frontend --namespace infrawatch --timeout=180s

      - name: Show local service URLs
        shell: powershell
        run: |
          kubectl get pods,svc --namespace infrawatch
          minikube service infrawatch-frontend --namespace infrawatch --url
