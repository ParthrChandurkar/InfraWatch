apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrawatch-alertmanager
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: infrawatch-alertmanager
    app.kubernetes.io/part-of: infrawatch-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infrawatch-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrawatch-alertmanager
        app.kubernetes.io/part-of: infrawatch-observability
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: infrawatch-alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: infrawatch-alertmanager
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: infrawatch-alertmanager
spec:
  selector:
    app.kubernetes.io/name: infrawatch-alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
