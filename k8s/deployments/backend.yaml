# FastAPI backend deployment with health probes and resource controls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrawatch-backend
  namespace: infrawatch
  labels:
    app.kubernetes.io/name: infrawatch-backend
    app.kubernetes.io/part-of: infrawatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infrawatch-backend
      app.kubernetes.io/part-of: infrawatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrawatch-backend
        app.kubernetes.io/part-of: infrawatch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /internal/metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: infrawatch-backend
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              until pg_isready -h infrawatch-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: infrawatch-postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: infrawatch-postgres-config
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: infrawatch-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: backend
          image: docker.io/parthchn178/infrawatch-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: infrawatch-backend-config
            - secretRef:
                name: infrawatch-secrets
          volumeMounts:
            - name: backend-state
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
      volumes:
        - name: backend-state
          emptyDir: {}
---
# ServiceAccount for future scoped Kubernetes API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infrawatch-backend
  namespace: infrawatch
---
# Minimal role allowing InfraWatch to manage namespace-local workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infrawatch-deployer
  namespace: infrawatch
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Role binding for the backend deployment service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infrawatch-deployer
  namespace: infrawatch
subjects:
  - kind: ServiceAccount
    name: infrawatch-backend
    namespace: infrawatch
roleRef:
  kind: Role
  name: infrawatch-deployer
  apiGroup: rbac.authorization.k8s.io
